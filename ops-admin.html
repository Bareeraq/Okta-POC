<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops-Admin</title>
</head>

<body>
    <script src="https://global.oktacdn.com/okta-auth-js/7.0.0/okta-auth-js.min.js"></script>
    <script src="auth.js"></script>
    <script src="rbac.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {

            try {

                // Restore login tokens if returning from Okta
                if (oktaAuth.isLoginRedirect()) {
                    await oktaAuth.handleLoginRedirect();
                }

                // Ensure user logged in
                if (!(await oktaAuth.isAuthenticated())) {
                    window.location.href = "index.html";
                    return;
                }

                // RBAC protection
                await protectPage("Ops-admin"); // ✅ correct case

                // Logout button
                attachLogoutHandler();

                // Debug
                console.log("Ops Admin User:", await oktaAuth.getUser());

            } catch (error) {
                console.error("Ops-admin page error:", error);
                window.location.href = "index.html";
            }

        });
    </script>


    <button id="logoutBtn">Logout</button>

</body>

</html>
