<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops-Admin</title>
</head>

<body>
    <script src="https://global.oktacdn.com/okta-auth-js/7.0.0/okta-auth-js.min.js"></script>
    <script src="auth.js"></script>
    <script src="rbac.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // Pass required role(s) — redirects automatically if check fails
            const user = await checkAuthAndRole(["Ops-admin"]);
            if (!user) return; // checkAuthAndRole already redirected

            attachLogoutHandler();
            document.querySelector("h2").textContent = `Welcome, ${user.name}!`;
        });
    </script>
    <h1>Admin Dashboard </h1>
    <h2>Welcome, Ops Admin!</h2>
    <button id="logoutBtn">Logout</button>

</body>

</html>
