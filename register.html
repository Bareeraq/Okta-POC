<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 20px; }
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        #message { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error   { background: #f8d7da; color: #721c24; }
        .link    { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>Create Account</h2>

    <input type="text"     id="firstName"  placeholder="First Name" />
    <input type="text"     id="lastName"   placeholder="Last Name" />
    <input type="email"    id="email"      placeholder="Email" />
    <input type="password" id="password"   placeholder="Password (min 8 chars)" />

    <label for="role">Role:</label>
    <select id="role" style="width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:4px;">
        <option value="">-- Select Role --</option>
        <option value="Rater">Rater</option>
        <option value="Reviewer">Reviewer</option>
        <option value="Client">Client</option>
    </select>

    <button onclick="registerUser()">Register</button>
    <div id="message"></div>
    <div class="link"><a href="index.html">Already have an account? Login</a></div>

    <script>
        async function registerUser() {
            const firstName = document.getElementById("firstName").value.trim();
            const lastName  = document.getElementById("lastName").value.trim();
            const email     = document.getElementById("email").value.trim();
            const password  = document.getElementById("password").value;
            const role      = document.getElementById("role").value;
            const msgEl     = document.getElementById("message");

            // --- Client-side validation ---
            if (!firstName || !lastName || !email || !password || !role) {
                showMessage("All fields are required.", "error");
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage("Please enter a valid email address.", "error");
                return;
            }
            if (password.length < 8) {
                showMessage("Password must be at least 8 characters.", "error");
                return;
            }

            try {
                // Call your backend registration endpoint
                // The backend will call Okta's Users API and assign the group
                const response = await fetch("http://localhost:3000/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ firstName, lastName, email, password, role })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage("Account created! Redirecting to login...", "success");
                    setTimeout(() => window.location.href = "index.html", 2000);
                } else {
                    showMessage(data.error || "Registration failed. Please try again.", "error");
                }
            } catch (err) {
                console.error("Registration error:", err);
                showMessage("Could not connect to server. Please try again.", "error");
            }
        }

        function showMessage(text, type) {
            const el = document.getElementById("message");
            el.textContent = text;
            el.className = type;
            el.style.display = "block";
        }
    </script>
</body>
</html>
